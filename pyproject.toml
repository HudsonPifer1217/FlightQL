[project]
name = "flightql"
version = "0.1.0"
description = "Natural-language questions over 37.8M U.S. flights: LLM-written SQL that is validated before it runs."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14",
    "duckdb>=1.1",
    "sqlglot>=26",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flightql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
